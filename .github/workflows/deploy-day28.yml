name: Deploy day-28 to Vercel
on:
  push:
    branches: [main]
    paths:
      - 'day-28-3d-data-visualization/**'
      - '.github/workflows/deploy-day28.yml'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_P0AhjcWKoUAspDgtOFE5uujN
  VERCEL_PROJECT_ID: prj_Bpkd65ITEIa1hKUxiEClwMJZr6UQ

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-28-3d-data-visualization
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: day-28-3d-data-visualization/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Link Vercel Project
        run: |
          mkdir -p .vercel
          cat << 'EOF' > .vercel/project.json
          {
            "projectId": "prj_Bpkd65ITEIa1hKUxiEClwMJZr6UQ",
            "orgId": "team_P0AhjcWKoUAspDgtOFE5uujN"
          }
          EOF

      - name: Pull Vercel Environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        continue-on-error: true

      - name: Build Project Artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel build --prod --token=$VERCEL_TOKEN || npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -d ".vercel/output" ]; then
            echo "Deploying prebuilt artifacts to Vercel production..."
            vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN --yes
          else
            echo "Deploying project source directly to Vercel production..."
            vercel deploy --prod --token=$VERCEL_TOKEN --yes
          fi
