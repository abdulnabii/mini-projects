name: Deploy day-30 to Vercel
on:
  push:
    branches: [main]
    paths:
      - 'day-30-ai-saas-boilerplate/**'
      - '.github/workflows/deploy-day30.yml'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_P0AhjcWKoUAspDgtOFE5uujN' }}
  VERCEL_PROJECT_ID: 'prj_5fuC7cVj1W0ojTA2FlIXzmeaRYIr'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: day-30-ai-saas-boilerplate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build Project Artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy Project Artifacts to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
